# Typecheck, build, and prove the standalone binary still works.
#
# The binary build runs on every platform the release ships, because that is
# where packaging breaks first — a bundling or code-signing problem is invisible
# to `tsc` and only shows up when the executable is assembled.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # Kept in step with release.yml. CI's job is to catch a packaging break before
  # a tag does, which it can only do if it compiles the binary with the same Bun
  # the release will use.
  BUN_VERSION: "1.3.14"

jobs:
  check:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # scripts/build-binary.mjs shells out to `bun build --compile`; the runner
      # images do not ship Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Every GraphQL operation is validated against a snapshot of the API's
      # schema, so a rename on the API side fails here instead of in a user's
      # terminal.
      - name: Test
        run: node --test test/*.test.mjs

      - name: The generated schema must match the committed one
        shell: bash
        run: |
          git diff --exit-code -- schema/naijacloud.schema.json || {
            echo "schema/naijacloud.schema.json is stale — run 'npm run build' and commit it." >&2
            exit 1
          }

      - name: Build the standalone binary
        run: node scripts/build-binary.mjs

      - name: Smoke-test the binary
        shell: bash
        run: |
          binary=$(find dist-bin -name 'naijacloud' -o -name 'naijacloud.exe' | head -1)
          "$binary" --version
          "$binary" schema > /dev/null
          # `whoami` exits non-zero when logged out, which is the state here.
          "$binary" whoami || true

          # The `njc` alias is a symlink beside the binary on every non-Windows
          # target, and must behave identically.
          alias_path="$(dirname "$binary")/njc"
          if [ -e "$alias_path" ]; then
            [ "$("$alias_path" --version)" = "$("$binary" --version)" ] \
              || { echo "njc and naijacloud report different versions" >&2; exit 1; }
            # Help is generated from the invoked name, so the alias must
            # document itself rather than the long name.
            "$alias_path" --help 2>&1 | grep -q '^njc — ' \
              || { echo "njc --help does not identify itself as njc" >&2; exit 1; }
          fi
