# Cuts a release across every distribution channel.
#
# Trigger: pushing a `v*` tag (or running it by hand with a version input).
#
#   tag ──> binaries (1 runner, 5 targets) ──> smoke ──> release ──> npm publish
#                                                          │
#                                                          ├─> .deb / .rpm
#                                                          └─> rendered manifests
#                                                              for Homebrew /
#                                                              Scoop / WinGet
#
# `bun build --compile` cross-compiles, so every platform's binary is produced
# on one Linux runner in seconds. Because nothing can execute a cross-compiled
# artifact on the machine that built it, the `smoke` job runs each one on its
# native runner before the release is allowed to proceed.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to package.json)"
        required: false

permissions:
  contents: write # create the release and upload assets
  id-token: write # npm provenance

env:
  # Pinned so every platform's binary embeds the same runtime, rather than
  # whatever each runner image happens to ship.
  NODE_VERSION: "22"
  BUN_VERSION: "1.3.14"

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: npm ci

      - name: Build (tsc + JSON Schema)
        run: npm run build

      - name: Cross-compile every platform
        run: node scripts/build-binary.mjs --target all

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist-bin/*.tar.gz
            dist-bin/*.zip
          if-no-files-found: error
          retention-days: 7

  # Nothing on the build runner can execute a cross-compiled artifact, so each
  # one is unpacked and run on its own platform here. A binary that will not
  # start — an unsigned Mach-O, a bad arch — fails the release before any
  # package manager can point at it.
  smoke:
    name: smoke ${{ matrix.target }}
    needs: binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin_arm64
            runner: macos-14
          # macos-13 was retired; macos-15-intel is the remaining Intel image.
          # If that label ever disappears too, drop this entry rather than let
          # the release queue forever — darwin_arm64 already proves the darwin
          # cross-compile, and both are produced by the same toolchain.
          - target: darwin_amd64
            runner: macos-15-intel
          - target: linux_amd64
            runner: ubuntu-latest
          - target: linux_arm64
            runner: ubuntu-24.04-arm
          - target: windows_amd64
            runner: windows-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist-bin

      - name: Run --version
        shell: bash
        run: |
          cd dist-bin
          if [ "${{ matrix.target }}" = "windows_amd64" ]; then
            unzip -q "naijacloud_"*"_${{ matrix.target }}.zip"
            ./naijacloud.exe --version
            # No `njc` here: a .zip cannot carry a symlink, so on Windows the
            # alias is created by the installer (a Scoop shim, a WinGet alias).
          else
            tar -xzf "naijacloud_"*"_${{ matrix.target }}.tar.gz"
            ./naijacloud --version
            # The archive ships `njc` as a symlink beside the binary. Running it
            # proves the link survived tar and resolves, on a runner that can
            # actually execute this architecture.
            ./njc --version
            # Both names are the same program, so they must agree on the version.
            [ "$(./njc --version)" = "$(./naijacloud --version)" ] \
              || { echo "njc and naijacloud report different versions" >&2; exit 1; }
          fi

  release:
    name: publish
    needs: [binaries, smoke]
    runs-on: ubuntu-latest

    # Hoisted to the job because a step's own `env:` block is not reliably
    # visible to that same step's `if:`. Declared here, the guards below are
    # unambiguous — otherwise a configured token could still silently skip.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Resolve the version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="$(node -p 'require("./package.json").version')"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Fail if the tag and package.json disagree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="${{ steps.version.outputs.version }}"
          test "$tag" = "$pkg" || {
            echo "Tag v$tag does not match package.json $pkg — bump one of them." >&2
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true

      - name: Checksums
        working-directory: dist-bin
        run: |
          sha256sum *.tar.gz *.zip > "naijacloud_${{ steps.version.outputs.version }}_checksums.txt"
          cat "naijacloud_${{ steps.version.outputs.version }}_checksums.txt"

      # The .deb and .rpm are built here rather than on the matrix runners:
      # nfpm reads an already-built binary, so one Linux job covers both arches.
      - name: Unpack the Linux binaries for nfpm
        working-directory: dist-bin
        run: |
          for arch in amd64 arm64; do
            archive="naijacloud_${{ steps.version.outputs.version }}_linux_${arch}.tar.gz"
            dir="naijacloud_${{ steps.version.outputs.version }}_linux_${arch}"
            mkdir -p "$dir" && tar -xzf "$archive" -C "$dir"
          done

      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin nfpm

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-pkg
          for arch in amd64 arm64; do
            # nfpm does not expand ${VERSION}/${ARCH} inside contents[].src, so
            # this architecture's binary is staged at the fixed path the config
            # names before nfpm runs.
            rm -rf dist-pkg/stage && mkdir -p dist-pkg/stage
            cp "dist-bin/naijacloud_${VERSION}_linux_${arch}/naijacloud" dist-pkg/stage/naijacloud
            ARCH="$arch" nfpm package -f packaging/nfpm.yaml -p deb -t dist-pkg/
            ARCH="$arch" nfpm package -f packaging/nfpm.yaml -p rpm -t dist-pkg/
          done
          # Removed so the staging copy is not swept into the release assets by
          # the dist-pkg/* glob below.
          rm -rf dist-pkg/stage
          ls -la dist-pkg

      - name: Render the Homebrew / Scoop / WinGet manifests
        run: |
          node scripts/render-packaging.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --checksums "dist-bin/naijacloud_${{ steps.version.outputs.version }}_checksums.txt"
          tar -czf "dist-bin/naijacloud_${{ steps.version.outputs.version }}_manifests.tar.gz" -C dist-packaging .

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            dist-bin/*.tar.gz dist-bin/*.zip dist-bin/*checksums.txt dist-pkg/*

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      # Downstream repositories are updated only when their tokens exist, so a
      # fork or a first release without them still completes.
      - name: Update the Homebrew tap
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/naijacloud/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist-packaging/homebrew/naijacloud.rb tap/Formula/naijacloud.rb
          cd tap
          git config user.name "naijacloud-bot"
          git config user.email "bot@naijacloud.com"
          # `git add`, not `commit -a`: on the first release into a fresh tap the
          # formula is a new file, and `-a` stages only what git already tracks.
          git add Formula/naijacloud.rb
          # Re-running the same version is a no-op, not a failure.
          git diff --cached --quiet || git commit -m "naijacloud ${VERSION}"
          git push

      - name: Update the Scoop bucket
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/naijacloud/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp dist-packaging/scoop/naijacloud.json bucket/bucket/naijacloud.json
          cd bucket
          git config user.name "naijacloud-bot"
          git config user.email "bot@naijacloud.com"
          # See the tap step above: a new manifest is untracked on a fresh bucket.
          git add bucket/naijacloud.json
          git diff --cached --quiet || git commit -m "naijacloud ${VERSION}"
          git push

  # WinGet is disabled for now. It is a pull request into microsoft/winget-pkgs,
  # so it needs a fork of that repository and a classic PAT (`public_repo`) in
  # WINGET_TOKEN — neither exists yet, and without them the job only ever
  # contributes a red X to an otherwise clean release.
  #
  # The manifests under packaging/templates/winget are still rendered on every
  # release, so they stay valid and this is a matter of uncommenting.
  #
  # Before re-enabling, pin the action to a tag or SHA rather than @main: it is
  # handed a classic PAT that can write to every public repository on the
  # account, so an unpinned third-party action is a real supply-chain exposure.
  #
  # winget:
  #   name: winget
  #   needs: release
  #   runs-on: windows-latest
  #   if: ${{ github.event_name == 'push' }}
  #   continue-on-error: true
  #   steps:
  #     - uses: vedantmgoyal9/winget-releaser@main
  #       with:
  #         identifier: NaijaCloud.CLI
  #         installers-regex: '_windows_amd64\.zip$'
  #         token: ${{ secrets.WINGET_TOKEN }}
