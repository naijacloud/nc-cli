# Cuts a release across every distribution channel.
#
# Trigger: pushing a `v*` tag (or running it by hand with a version input).
#
#   tag ──> binaries (1 runner, 5 targets) ──> smoke ──> release ──> npm publish
#                                                          │
#                                                          ├─> .deb / .rpm
#                                                          ├─> rendered manifests
#                                                          │   for Homebrew /
#                                                          │   Scoop / WinGet
#                                                          └─> package-managers:
#                                                              push the tap and
#                                                              the bucket (needs
#                                                              TAP_TOKEN; fails on
#                                                              its own, after npm
#                                                              and the release)
#
# `bun build --compile` cross-compiles, so every platform's binary is produced
# on one Linux runner in seconds. Because nothing can execute a cross-compiled
# artifact on the machine that built it, the `smoke` job runs each one on its
# native runner before the release is allowed to proceed.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (defaults to package.json)"
        required: false

permissions:
  contents: write # create the release and upload assets
  id-token: write # npm trusted publishing (OIDC) and the provenance it attests

env:
  # Pinned so every platform's binary embeds the same runtime, rather than
  # whatever each runner image happens to ship.
  NODE_VERSION: "22"
  BUN_VERSION: "1.3.14"

jobs:
  binaries:
    name: binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: npm ci

      - name: Build (tsc + JSON Schema)
        run: npm run build

      - name: Cross-compile every platform
        run: node scripts/build-binary.mjs --target all

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist-bin/*.tar.gz
            dist-bin/*.zip
          if-no-files-found: error
          retention-days: 7

  # Nothing on the build runner can execute a cross-compiled artifact, so each
  # one is unpacked and run on its own platform here. A binary that will not
  # start — an unsigned Mach-O, a bad arch — fails the release before any
  # package manager can point at it.
  smoke:
    name: smoke ${{ matrix.target }}
    needs: binaries
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: darwin_arm64
            runner: macos-14
          # macos-13 was retired; macos-15-intel is the remaining Intel image.
          # If that label ever disappears too, drop this entry rather than let
          # the release queue forever — darwin_arm64 already proves the darwin
          # cross-compile, and both are produced by the same toolchain.
          - target: darwin_amd64
            runner: macos-15-intel
          - target: linux_amd64
            runner: ubuntu-latest
          - target: linux_arm64
            runner: ubuntu-24.04-arm
          - target: windows_amd64
            runner: windows-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist-bin

      - name: Run --version
        shell: bash
        run: |
          cd dist-bin
          if [ "${{ matrix.target }}" = "windows_amd64" ]; then
            unzip -q "naijacloud_"*"_${{ matrix.target }}.zip"
            ./naijacloud.exe --version
            # No `njc` here: a .zip cannot carry a symlink, so on Windows the
            # alias is created by the installer (a Scoop shim, a WinGet alias).
          else
            tar -xzf "naijacloud_"*"_${{ matrix.target }}.tar.gz"
            ./naijacloud --version
            # The archive ships `njc` as a symlink beside the binary. Running it
            # proves the link survived tar and resolves, on a runner that can
            # actually execute this architecture.
            ./njc --version
            # Both names are the same program, so they must agree on the version.
            [ "$(./njc --version)" = "$(./naijacloud --version)" ] \
              || { echo "njc and naijacloud report different versions" >&2; exit 1; }
          fi

  release:
    name: publish
    needs: [binaries, smoke]
    runs-on: ubuntu-latest

    # npm publishes by trusted publishing: npm trades this run's OIDC token for
    # a credential that lives for minutes, so there is no NPM_TOKEN to leak,
    # expire or rotate. The trusted publisher on npmjs.com names this workflow
    # file and this environment; rename either and publishing fails with an
    # auth error. The environment is also where a required reviewer can go.
    environment:
      name: npm
      url: https://www.npmjs.com/package/@naijacloud/cli

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or later. The npm bundled with Node 22
      # predates it and falls through to looking for a token that is not there,
      # failing with an auth error that says nothing about the cause. Pinned to
      # 11 rather than latest: npm 12 dropped support for some Node 22 releases.
      - name: Upgrade npm to a version that can publish with OIDC
        run: npm install -g npm@11

      - run: npm ci

      - name: Resolve the version
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version="$(node -p 'require("./package.json").version')"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Fail if the tag and package.json disagree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg="${{ steps.version.outputs.version }}"
          test "$tag" = "$pkg" || {
            echo "Tag v$tag does not match package.json $pkg — bump one of them." >&2
            exit 1
          }

      - uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true

      - name: Checksums
        working-directory: dist-bin
        run: |
          sha256sum *.tar.gz *.zip > "naijacloud_${{ steps.version.outputs.version }}_checksums.txt"
          cat "naijacloud_${{ steps.version.outputs.version }}_checksums.txt"

      # The .deb and .rpm are built here rather than on the matrix runners:
      # nfpm reads an already-built binary, so one Linux job covers both arches.
      - name: Unpack the Linux binaries for nfpm
        working-directory: dist-bin
        run: |
          for arch in amd64 arm64; do
            archive="naijacloud_${{ steps.version.outputs.version }}_linux_${arch}.tar.gz"
            dir="naijacloud_${{ steps.version.outputs.version }}_linux_${arch}"
            mkdir -p "$dir" && tar -xzf "$archive" -C "$dir"
          done

      - name: Install nfpm
        run: |
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_x86_64.tar.gz \
            | tar -xz -C /usr/local/bin nfpm

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist-pkg
          for arch in amd64 arm64; do
            # nfpm does not expand ${VERSION}/${ARCH} inside contents[].src, so
            # this architecture's binary is staged at the fixed path the config
            # names before nfpm runs.
            rm -rf dist-pkg/stage && mkdir -p dist-pkg/stage
            cp "dist-bin/naijacloud_${VERSION}_linux_${arch}/naijacloud" dist-pkg/stage/naijacloud
            ARCH="$arch" nfpm package -f packaging/nfpm.yaml -p deb -t dist-pkg/
            ARCH="$arch" nfpm package -f packaging/nfpm.yaml -p rpm -t dist-pkg/
          done
          # Removed so the staging copy is not swept into the release assets by
          # the dist-pkg/* glob below.
          rm -rf dist-pkg/stage
          ls -la dist-pkg

      - name: Render the Homebrew / Scoop / WinGet manifests
        run: |
          node scripts/render-packaging.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --checksums "dist-bin/naijacloud_${{ steps.version.outputs.version }}_checksums.txt"
          tar -czf "dist-bin/naijacloud_${{ steps.version.outputs.version }}_manifests.tar.gz" -C dist-packaging .

      # Skipped when the release already exists, so "Re-run failed jobs" after a
      # failed npm publish gets past this step instead of failing on it.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists; not recreating it."
            exit 0
          fi
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes \
            dist-bin/*.tar.gz dist-bin/*.zip dist-bin/*checksums.txt dist-pkg/*

      # No token and no --provenance flag: under trusted publishing npm
      # authenticates and attests from the OIDC claim on its own. This step is
      # never skipped. It used to be skipped when NPM_TOKEN was unset, which
      # would let a release go green without reaching npm. A version npm
      # already has is skipped, so re-running a half-finished release works.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "@naijacloud/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@naijacloud/cli@$VERSION is already on npm; not publishing it again."
            exit 0
          fi
          npm publish --access public

      # Handed to the `package-managers` job below, which runs after this one
      # has already published, so a bad tap token can no longer hold up npm or
      # the GitHub release.
      - uses: actions/upload-artifact@v4
        with:
          name: packaging
          path: dist-packaging
          if-no-files-found: error
          retention-days: 7

  # The Homebrew tap and the Scoop bucket live in other repositories, so pushing
  # to them needs TAP_TOKEN. They used to be the last steps of `release`, guarded
  # by "skip if the secret is empty": an expired token failed the tap push, the
  # bucket step never ran, and a missing token skipped both with a green tick —
  # in every case `brew install` and `scoop install` were left with nothing to
  # install (TGL-724).
  #
  # Now they are a job of their own that runs only after npm and the GitHub
  # release are out. Each channel is attempted on its own, and the job then fails
  # with one message naming what did not happen and how to fix it. Once the
  # token is fixed, "Re-run failed jobs" on the same run finishes the release;
  # nothing has to be re-tagged.
  package-managers:
    name: homebrew + scoop
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: dist-packaging

      # Checks the token can at least read both repositories, so a missing or
      # expired secret is reported as that, not as a git error halfway through
      # a push. It cannot prove write access; the push steps report that.
      - name: Check TAP_TOKEN
        id: token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error title=TAP_TOKEN is not set::The Homebrew tap and Scoop bucket were not updated. Add a fine-grained token with Contents: read and write on naijacloud/homebrew-tap and naijacloud/scoop-bucket as the TAP_TOKEN secret, then re-run this job."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ok=true
          for repo in homebrew-tap scoop-bucket; do
            if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)" \
                ls-remote --heads "https://github.com/naijacloud/${repo}.git" > /dev/null 2>&1; then
              echo "::error title=TAP_TOKEN cannot read naijacloud/${repo}::The token is expired, revoked, or not granted this repository. Replace the TAP_TOKEN secret, then re-run this job."
              ok=false
            fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"

      # The token goes in an extra header for this one command rather than in
      # the clone URL, so it is never written into the clone's .git/config.
      - name: Update the Homebrew tap
        id: tap
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" clone https://github.com/naijacloud/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp dist-packaging/homebrew/naijacloud.rb tap/Formula/naijacloud.rb
          cd tap
          git config user.name "naijacloud-bot"
          git config user.email "bot@naijacloud.com"
          # `git add`, not `commit -a`: on the first release into a fresh tap the
          # formula is a new file, and `-a` stages only what git already tracks.
          git add Formula/naijacloud.rb
          # Re-running the same version is a no-op, not a failure.
          git diff --cached --quiet || git commit -m "naijacloud ${VERSION}"
          git -c "http.https://github.com/.extraheader=$auth" push origin HEAD

      # Runs whether or not the tap push worked: the two are independent.
      - name: Update the Scoop bucket
        id: bucket
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" clone https://github.com/naijacloud/scoop-bucket.git bucket
          mkdir -p bucket/bucket
          cp dist-packaging/scoop/naijacloud.json bucket/bucket/naijacloud.json
          cd bucket
          git config user.name "naijacloud-bot"
          git config user.email "bot@naijacloud.com"
          # See the tap step above: a new manifest is untracked on a fresh bucket.
          git add bucket/naijacloud.json
          git diff --cached --quiet || git commit -m "naijacloud ${VERSION}"
          git -c "http.https://github.com/.extraheader=$auth" push origin HEAD

      - name: Report
        if: always()
        env:
          TOKEN_OK: ${{ steps.token.outputs.ok }}
          TAP: ${{ steps.tap.outcome }}
          BUCKET: ${{ steps.bucket.outcome }}
        run: |
          {
            echo "### Homebrew and Scoop for v${VERSION}"
            echo
            echo "| Channel | Result |"
            echo "| --- | --- |"
            echo "| Homebrew tap (naijacloud/homebrew-tap) | ${TAP} |"
            echo "| Scoop bucket (naijacloud/scoop-bucket) | ${BUCKET} |"
            echo
            echo "npm and the GitHub release were published by the \`publish\` job before this one ran."
          } >> "$GITHUB_STEP_SUMMARY"
          failed=""
          [ "$TAP" = "success" ] || failed="the Homebrew tap"
          if [ "$BUCKET" != "success" ]; then
            failed="${failed:+$failed and }the Scoop bucket"
          fi
          if [ -n "$failed" ]; then
            if [ "$TOKEN_OK" != "true" ]; then
              why="TAP_TOKEN is missing or cannot read the repositories (see the error above)."
            else
              why="the push failed; usually TAP_TOKEN lacks Contents: write on that repository."
            fi
            echo "::error title=v${VERSION} did not reach ${failed}::npm and the GitHub release are out, but ${failed} did not get v${VERSION}: ${why} Fix the TAP_TOKEN secret, then use Re-run failed jobs on this run."
            exit 1
          fi

  # WinGet is disabled for now. It is a pull request into microsoft/winget-pkgs,
  # so it needs a fork of that repository and a classic PAT (`public_repo`) in
  # WINGET_TOKEN — neither exists yet, and without them the job only ever
  # contributes a red X to an otherwise clean release.
  #
  # The manifests under packaging/templates/winget are still rendered on every
  # release, so they stay valid and this is a matter of uncommenting.
  #
  # Before re-enabling, pin the action to a tag or SHA rather than @main: it is
  # handed a classic PAT that can write to every public repository on the
  # account, so an unpinned third-party action is a real supply-chain exposure.
  #
  # winget:
  #   name: winget
  #   needs: release
  #   runs-on: windows-latest
  #   if: ${{ github.event_name == 'push' }}
  #   continue-on-error: true
  #   steps:
  #     - uses: vedantmgoyal9/winget-releaser@main
  #       with:
  #         identifier: NaijaCloud.CLI
  #         installers-regex: '_windows_amd64\.zip$'
  #         token: ${{ secrets.WINGET_TOKEN }}
