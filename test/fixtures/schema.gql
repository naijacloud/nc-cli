  """
  Admin-only. Every counter, chart and sender row the Email-sending screen renders. Rates are 0-1 fractions over a 30-day window and the thresholds they are judged against are returned with them. The filter and search narrow the sender rows only — the platform totals always describe every sender.
  """
  getAdminEmailOverview(filter: AdminEmailSenderFilter, search: String): AdminEmailOverview!

  """
