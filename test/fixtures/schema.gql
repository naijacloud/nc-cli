type Mutation {
  """
  Cancel a multipart upload and free the parts already stored. Requires MEMBER on the team.
  """
  abortStorageMultipartUpload(AbortMultipartUploadInput: AbortMultipartUploadInput!, region: String, teamId: ID!): Boolean!

  """
  Redeem an invite token as the signed-in user and join the workspace. The invite must have been addressed to their own email address.
  """
  acceptInvite(token: String!): Team!

  """
  Attach a custom domain to a web service and start verification. Resolve dnsTarget on the result to show the record the customer must create. Triggers a redeploy so the route and certificate apply. Requires MEMBER.
  """
  addCustomDomain(domain: String!, serviceId: ID!): CustomDomain!

  """
  Add a record to a zone and publish it to the nameservers. Requires MEMBER on the owning team.
  """
  addDnsRecord(DnsRecordInput: DnsRecordInput!, zoneId: ID!): DnsRecord!

  """
  Admin-only. Add an internal note to a ticket. Notes are visible to operators only: the customer never sees them, nobody is emailed, the status does not change and the first-response SLA keeps running.
  """
  adminAddTicketNote(body: String!, ticketId: ID!): SupportTicket!

  """
  Admin-only. Assign a ticket to an admin, or hand it back by passing userId: null. Safe to repeat - assigning to the current holder is a no-op.
  """
  adminAssignTicket(ticketId: ID!, userId: ID): SupportTicket!

  """
  Admin-only and disruptive. Cordons a node then evacuates its workloads onto another node in the same region via node recovery; datastores are recreated and restored from their newest backup, so anything in servicesWithoutBackup comes back empty. Asynchronous - poll nodeRecovery with the returned recoveryId.
  """
  adminDrainNode(nodeId: ID!, targetNodeName: String): AdminDrainResult!

  """
  Public. Exchange the env-configured operator credentials (ADMIN_EMAIL / ADMIN_PASSWORD) for a 2-hour admin session. Sets the HttpOnly nc.admin cookie that every other admin operation reads; the returned accessToken is for scripts that send a bearer header instead.
  """
  adminLogin(email: String!, password: String!): AdminAuthPayload!

  """
  Public and idempotent. Ends the current admin session server-side, so the token stops working everywhere a copy of it exists, and clears the HttpOnly nc.admin cookie. Always returns true.
  """
  adminLogout: Boolean!

  """
  Ends EVERY open admin session on every device, including this one, and clears the nc.admin cookie. Use it when an admin token may have leaked.
  """
  adminLogoutAll: Boolean!

  """
  Admin-only. Mark a ticket resolved; the shorthand behind the console's Mark resolved button.
  """
  adminMarkTicketResolved(ticketId: ID!): SupportTicket!

  """Admin-only. Post a support reply on a ticket and move it to PENDING."""
  adminReplyToTicket(body: String!, ticketId: ID!): SupportTicket!

  """
  Admin-only. Turn off a user's two-factor for somebody locked out of it. Requires a reason, writes an audit record naming the admin, and emails the account holder.
  """
  adminResetUserTwoFactor(AdminResetUserTwoFactorInput: AdminResetUserTwoFactorInput!): AdminUserTwoFactor!

  """
  Admin-only. Let a suspended sending domain send again. A reason is mandatory: it is recorded in the audit log and emailed to the workspace owner, though the account itself no longer carries a suspension once it is lifted. Attributed to the calling admin.
  """
  adminResumeMailSending(domainId: ID!, reason: String!): AdminEmailSenderRow!

  """
  Admin-only. Cordon or uncordon a node. Placement only: nothing running is stopped, moved or restarted, the node simply stops receiving new workloads.
  """
  adminSetNodeSchedulable(nodeId: ID!, reason: String, schedulable: Boolean!): AdminNodeRow!

  """
  Admin-only. Change a ticket's priority. The first-response SLA deadline is derived from the current priority, so it moves with it.
  """
  adminSetTicketPriority(priority: TicketPriority!, ticketId: ID!): SupportTicket!

  """
  Admin-only. Set a ticket's status explicitly - resolve, reopen or mark pending.
  """
  adminSetTicketStatus(status: TicketStatus!, ticketId: ID!): SupportTicket!

  """
  Admin-only. Move a user onto a billing plan (Hobby/Pro/Scale) and return the updated row.
  """
  adminSetUserPlan(plan: UserPlan!, userId: ID!): AdminUserRow!

  """
  Admin-only. Set a user's account status (Active/Trial/Suspended). Suspending requires a `reason`. It is a console flag today: it does not block sign-in or stop services. Every change is recorded with the admin who made it; the row returns the current suspension, if any.
  """
  adminSetUserStatus(reason: String, status: UserStatus!, userId: ID!): AdminUserRow!

  """
  Admin-only. Stop a sending domain's outbound mail. Queued messages are held rather than dropped and the customer keeps console access. A reason is mandatory: it is stored on the account and emailed verbatim to the workspace owner. Attributed to the calling admin. A mail failure never fails the suspension — it is already written by then.
  """
  adminSuspendMailSending(domainId: ID!, reason: String!): AdminEmailSenderRow!

  """
