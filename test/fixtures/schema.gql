  """
  Public. Exchange a GitHub OAuth code for our own signed JWT, creating the account on first use, and set the auth cookie. Refused when the GitHub email already has an account that cannot be linked automatically; prefer `signInWithGithub`, which says so.
  """
  loginWithGithub(code: String!): AuthPayload! @deprecated(reason: "Use signInWithGithub, which can answer existingAccount")

  """
  Public. Exchange a Google code (with its PKCE verifier) for a session, creating the account on first use and setting the auth cookie. When the email already has an account that cannot be linked automatically, returns `existingAccount` instead and creates nothing. Throttled to 10 per minute.
  """
  loginWithGoogle(GoogleCodeInput: GoogleCodeInput!): GoogleSignInResult!

  """
  Public and idempotent. Ends the session: clears the HttpOnly auth cookie, which JavaScript cannot do itself, and invalidates the tokens already issued to that account so they stop working immediately. Signs the account out everywhere, not just on this device.
  """
  logout: Boolean!

  """
  Pause one environment: stop every service in it - web services, static sites, cron jobs, databases and caches - keeping their data, volumes, variables, domains and deploy history. Other environments keep running. Compute is not billed while paused; database storage still is. Its URLs and custom domains show a "This environment is paused" page. Deploys, cron runs and new services in it are refused until it is resumed. Resuming the project does not resume an environment paused on its own. Idempotent: running it again retries any service it could not stop. Requires ADMIN on the owning team.
  """
  pauseEnvironment(PauseEnvironmentInput: PauseEnvironmentInput!): EnvironmentPauseResult!

  """
  Pause a whole project: stop every service in every environment - web services, static sites, cron jobs, databases and caches - keeping their data, volumes, variables, domains and deploy history. Compute is not billed while paused; database and bucket storage still is. Its URLs and custom domains show a "This project is paused" page. Deploys, cron runs and new services are refused until it is resumed. Idempotent: running it again retries any service it could not stop. Requires ADMIN on the owning team.
  """
  pauseProject(PauseProjectInput: PauseProjectInput!): ProjectPauseResult!

  """
  Create the team's object store in a region. The returned credentials are shown once and cannot be retrieved again this way. Requires ADMIN on the team.
  """
  provisionObjectStore(region: String!, teamId: ID!): ObjectStorageConnection!

  """
  Add a sending domain's DNS records to the workspace's Naijacloud DNS zone that holds it, as managed records. Records the customer already has at those names are kept and reported in `skipped`. Requires membership of the team; throttled to 20 per 10 minutes.
  """
  publishMailDomainRecords(id: ID!, teamId: ID!): MailDnsPublishResult!

  """
  Start buying a domain: reserves the order and returns a payment page to send the customer to. The domain is registered when the payment lands, not here, so a customer who never pays costs nothing. Priced and charged in naira: the checkout is created for exactly the `priceKobo` the search returned. Requires ADMIN on the team.
  """
  purchaseDomain(PurchaseDomainInput: PurchaseDomainInput!, teamId: ID!): DomainCheckout!

  """
  Admin-only maintenance operation. Walks every team's live web services and (re)points an explicit per-service DNS record at the node it currently runs on, so apps relying only on the wildcard get their own record. Idempotent; returns how many were reconciled.
  """
  reconcileServiceDns: Int!

  """
  Record a completed presigned upload in the activity feed, since the upload itself never touches the control plane. `key` may be an object key or a prefix like "assets/" for a folder upload. Requires MEMBER on the team.
  """
  recordStorageUpload(bucket: String!, key: String!, teamId: ID!): Boolean!

  """
  Admin-only and destructive. Replays a node's workloads, recreating datastores and redeploying customer services. Omit targetNodeName to rebuild in place, or pass it to evacuate onto another node.
  """
  recoverNode(nodeName: String!, targetNodeName: String): NodeRecovery!

  """
  Replace an existing static site's content from a fresh upload, in place and on the same URL. Returns the new deployment.
  """
  redeployStaticSite(RedeployStaticSiteInput: RedeployStaticSiteInput!): Deployment!

  """
  Replace every recovery code with ten new ones, proven with a current app code. The old codes stop working at once. Session only.
  """
  regenerateTwoFactorRecoveryCodes(RegenerateTwoFactorRecoveryCodesInput: RegenerateTwoFactorRecoveryCodesInput!): TwoFactorRecoveryCodes!

  """
  Admin-only operator tool. Creates a user account directly, with no signup flow, verification email or auth cookie. Returns the new user.
  """
  register(RegisterInput: RegisterInput!): User!

  """
  Admin-only. Withdraw a service's abuse exemption, putting it back under enforcement. Attributed to the calling admin.
  """
  removeAbuseExemption(serviceId: String!): AbuseFindingRow!

  """
  Destructive. Detach a custom domain from its service and trigger a redeploy that drops the route, so the domain stops serving. Requires MEMBER on the owning team.
  """
  removeCustomDomain(id: ID!): Boolean!

  """
  Remove an address from the team's suppression list so it can be mailed again. Returns false for spam complaints, which are never removable.
  """
  removeMailSuppression(address: String!, teamId: ID!): Boolean!

  """
  Remove another member from the workspace, revoking their access to everything it owns. Requires ADMIN on the team.
  """
  removeMember(teamId: ID!, userId: ID!): Boolean!

  """
  Admin-only and destructive. Permanently delete a stored fleet credential; anything that depended on it stops working until it is uploaded again.
  """
  removeNodeSecret(kind: NodeSecretKind!, nodeName: String): Boolean!

  """Rename a workspace. Requires ADMIN on the team."""
  renameTeam(name: String!, teamId: ID!): Team!

  """
  Renew a domain: reserves the order and returns a payment page. The registry is extended when the payment lands, not here. Returns the existing checkout when one is already open for this domain, so a customer cannot accidentally buy two renewals. Requires ADMIN on the owning team.
  """
  renewDomain(domainId: ID!, years: Int = 1): DomainCheckout!

  """
  Add a customer reply to the user's own ticket, which reopens it for support. Requires a signed-in user.
  """
  replyToTicket(body: String!, ticketId: ID!): SupportTicket!

  """
  Publish a zone to the nameservers again. Idempotent, and intended for a zone whose last publish failed — a zone is saved before it is published, so a nameserver outage otherwise leaves it stuck. Requires MEMBER on the owning team.
  """
  republishDnsZone(zoneId: ID!): DnsZone!

  """
  Start changing the sign-in email. Needs the current password, or the code from sendEmailChangeCode for an account without one. Emails a link to the new address that works for 1 hour; nothing changes until it is opened. Refuses an address that already has an account.
  """
  requestEmailChange(RequestEmailChangeInput: RequestEmailChangeInput!): PendingEmailChange!

  """
  Public. Emails a password-reset link and invalidates any previous one. Always returns true, whether or not the address maps to an account, so it cannot be used to enumerate users. Throttled to 5 per 5 minutes.
  """
  requestPasswordReset(email: String!): Boolean!

  """
  Send a pending invite again with a fresh link valid for seven more days. The earlier link stops working. Requires ADMIN on the team.
  """
  resendInvite(inviteId: ID!): Invite!

  """
  Send the signed-in user a fresh verification link. Throttled to 5 per 10 minutes on top of the service's own per-account limits.
  """
  resendVerificationEmail: Boolean!

  """
  Public. Set a new password using the token from a reset email. Throws on an invalid or expired token or a password that is too short. Throttled to 10 per minute.
  """
  resetPassword(newPassword: String!, token: String!): Boolean!

  """
  Destructive. Restores a backup over the live database in place, after taking an automatic safety snapshot first. Returns the PENDING restore to poll. Requires ADMIN on the owning team.
  """
  restoreBackup(backupId: ID!): Restore!

  """
  Undo `revokeInvite`: reinstate a cancelled invite with its original link and expiry, without emailing it again. Works for ten minutes after the cancel, and not if the address has been invited again since. Requires ADMIN on the team.
  """
  restoreInvite(inviteId: ID!): Invite!

  """
  Admin-only. Lift an abuse suspension and bring the customer's service back up. Attributed to the calling admin.
  """
  resumeAbuseSuspendedService(serviceId: String!): AbuseFindingRow!

  """
  Resume a paused environment: restart every service its pause stopped from its current deploy (no rebuild), and databases and caches against their existing volumes. Refused while the whole project is paused - resume the project first. Idempotent: running it again retries any service it could not start. Requires ADMIN on the owning team.
  """
  resumeEnvironment(ResumeEnvironmentInput: ResumeEnvironmentInput!): EnvironmentPauseResult!

  """
  Lift a reputation pause and let a domain send again. Deliberately manual, with no automatic counterpart: a domain that un-pauses itself after a bounce storm just produces another one.
  """
  resumeMailDomain(id: ID!, teamId: ID!): MailDomain!

  """
  Resume a paused project: restart every service the pause stopped from its current deploy (no rebuild), and databases and caches against their existing volumes. A service switched off on its own before the pause stays off. Idempotent: running it again retries any service it could not start. Requires ADMIN on the owning team.
  """
  resumeProject(ResumeProjectInput: ResumeProjectInput!): ProjectPauseResult!

  """
  Bring a suspended service back on the same URL, by redeploying its current configuration. Requires MEMBER on the owning team.
  """
  resumeService(serviceId: ID!): Service!

  """
  Permanently revoke one of the caller's API tokens. Irreversible - the token stops authenticating from its next request.
  """
  revokeApiToken(id: ID!): Boolean!

  """
  Cancel a pending invite so its link stops working. It can be brought back with `restoreInvite` for ten minutes. Requires ADMIN on the team.
  """
  revokeInvite(inviteId: ID!): Boolean!

  """
  Permanently revoke a mail API key. Irreversible - anything sending with it starts failing immediately. Requires membership of the team.
  """
  revokeMailApiKey(id: ID!, teamId: ID!): MailApiKey!

  """
  Revoke an S3 access key in every region. Anything using it loses access to the workspace’s buckets straight away; the buckets are not affected. Cannot be undone. Requires ADMIN on the team.
  """
  revokeStorageAccessKey(RevokeStorageAccessKeyInput: RevokeStorageAccessKeyInput!): Boolean!

  """
  Redeploy the exact image a previous deployment ran, rather than rebuilding its commit. Only offered for a successful deployment that carries an image digest. Requires MEMBER on the owning team.
  """
  rollbackDeployment(deploymentId: ID!): Deployment!

  """
  Mint a new signing secret for an endpoint and return it once. The previous secret keeps being signed with for 24 hours, so both are accepted while the new one is rolled out. Throttled to 20 per hour.
  """
  rotateMailWebhookEndpointSecret(id: ID!, teamId: ID!): CreatedMailWebhookEndpoint!

  """
  Take an on-demand backup of a database immediately. Returns the backup in PENDING. Requires MEMBER on the owning team.
  """
  runBackupNow(serviceId: ID!): Backup!

  """
  Run one allow-listed Redis/Valkey command from the studio CLI and return the reply as display lines. Requires MEMBER on the owning team.
  """
  runCacheCommand(command: String!, serviceId: ID!): [String!]!

  """
  Run a cron job once, immediately, outside its schedule. Returns the queued run to poll. Requires MEMBER on the owning team.
  """
  runCronJob(serviceId: ID!): CronRun!

  """
  Run a SQL statement (Postgres/MySQL/MariaDB) or a mongosh expression (MongoDB) and return a result grid. Executes as the service's own database user, so it can write and drop as well as read - treat it as a real console. Requires MEMBER on the owning team.
  """
  runDatabaseQuery(maxRows: Int, serviceId: ID!, statement: String!): DbQueryResult!

  """
  Admin-only. Queue a control-plane backup immediately instead of waiting for the schedule. Returns the BullMQ job id.
  """
  runPlatformDrBackup: String!

  """
  Admin-only. Queue a restore verification immediately - spins up a throwaway Postgres and restores the latest dump into it. Returns the BullMQ job id.
  """
  runPlatformDrVerify: String!

  """
  Create a saved query, or update one when `id` is supplied. Saved queries are shared with the whole team. Requires MEMBER on the owning team.
  """
  saveQuery(SaveQueryInput: SaveQueryInput!): SavedQuery!

  """
  For an account with no password: email a 6-digit code to the current address, to confirm an email change with. Rate limited per account.
  """
  sendEmailChangeCode: Boolean!

  """
  Send a real test email from the dashboard, used to confirm a freshly verified domain delivers. Runs the same checks as an API send - verified domain, not paused, recipient not suppressed, within quota - and is throttled to 20 per hour.
  """
  sendTestEmail(body: String!, from: String!, subject: String!, teamId: ID!, to: String!): SentTestEmail!

  """
  Admin-only. Set whether the abuse sweep may suspend services on its own or only flag them for review. Attributed to the calling admin.
  """
  setAbuseEnforcementMode(mode: AbuseEnforcementMode!): AbuseEnforcementMode!

  """
  Turn one backup cadence (hourly, daily or weekly) on or off for a database. Returns the updated schedule. Requires MEMBER on the owning team.
  """
  setBackupFrequency(enabled: Boolean!, frequency: BackupFrequency!, serviceId: ID!): BackupSchedule!

  """
  Replace a bucket's CORS rules wholesale - rules not included are dropped, which can break browser uploads already relying on them. Requires ADMIN on the team.
  """
  setBucketCors(CorsRuleInput: [CorsRuleInput!]!, bucket: String!, region: String, teamId: ID!): Boolean!

  """
  Replace a bucket's lifecycle rules wholesale - rules not included are dropped. Lifecycle rules expire objects, so this can schedule data deletion. Requires ADMIN on the team.
  """
  setBucketLifecycle(LifecycleRuleInput: [LifecycleRuleInput!]!, bucket: String!, region: String, teamId: ID!): Boolean!

  """
  Replace a bucket's policy JSON, which is what makes it publicly readable or not. ARNs must use the real bucket name. Requires ADMIN on the team.
  """
  setBucketPolicy(bucket: String!, policy: String!, region: String, teamId: ID!): Boolean!

  """
  Turn block-all-public-access on or off. Turning it off is what allows a bucket policy to expose objects publicly. Requires ADMIN on the team.
  """
  setBucketPublicAccessBlock(bucket: String!, enabled: Boolean!, region: String, teamId: ID!): Boolean!

  """
  Enable or suspend object versioning on a bucket. Suspending stops new versions being kept; existing ones remain. Requires ADMIN on the team.
  """
  setBucketVersioning(bucket: String!, enabled: Boolean!, region: String, teamId: ID!): Boolean!

  """
  Change one cache configuration parameter on the running server. Only an allow-listed set of parameters is accepted; the change takes effect immediately. Returns the refreshed config. Requires MEMBER on the owning team.
  """
  setCacheConfig(param: String!, serviceId: ID!, value: String!): RedisConfig!

  """
  Pause or resume a cron job's scheduled runs. Manual runs still work while it is paused. Requires MEMBER on the owning team.
  """
  setCronJobSuspended(serviceId: ID!, suspended: Boolean!): Service!

  """
  Open, close or narrow a database's public TLS endpoint. Turning it off or listing allowed IP addresses takes effect within seconds and never touches the private network apps in the project use. Postgres only. Requires ADMIN on the owning team.
  """
  setDatabaseExternalAccess(SetDatabaseExternalAccessInput: SetDatabaseExternalAccessInput!): Service!

  """
  Turn renewal reminders on or off for a domain. This does NOT renew anything and never touches the registrar's own autorenew: a renewal is a payment link the customer follows, so letting the registry renew would bill us for a customer who has not paid. What this controls is whether we email them before it expires. Requires ADMIN on the owning team.
  """
  setDomainAutoRenew(autoRenew: Boolean!, domainId: ID!): RegisteredDomain!

  """
  Change which nameservers a domain bought here uses. CUSTOM sets 2 to 13 nameservers at the registry, e.g. another DNS provider's; NC puts it back on Naijacloud DNS. Our zone and its records are kept, so switching back restores them. Changes can take up to 48 hours to reach everyone. Requires ADMIN on the owning team.
  """
  setDomainNameservers(SetDomainNameserversInput: SetDomainNameserversInput!): RegisteredDomain!

  """
  Create or update environment variables in bulk. Returns any warnings plus a hint about whether a redeploy is needed for them to take effect. Requires MEMBER on the owning team.
  """
  setEnvVars(EnvVarInput: [EnvVarInput!]!, serviceId: ID!): EnvVarMutationResult!

  """
  Put an existing member on a role, and optionally give them their own project scope. Requires ADMIN. A null roleId clears the named role, falling the member back to their rank.
  """
  setMemberRole(SetMemberRoleInput: SetMemberRoleInput!): TeamMembership!

  """
  Create or replace one secret file on a service. Applies on the next deploy. Requires MEMBER on the owning team.
  """
  setSecretFile(SecretFileInput: SecretFileInput!, serviceId: ID!): SecretFileMutationResult!

  """
  Configure how a datastore's connection string reaches apps in its environment: rename the injected variable so several engines of one family can coexist, and/or turn injection off. Pass connectionEnvName: null to restore the engine default; omitted arguments are unchanged. Redeploys the environment's apps. Requires ADMIN on the owning team.
  """
  setServiceConnectionInjection(connectionEnvName: String, injectConnectionUrl: Boolean, serviceId: ID!): Service!

  """
  Turn PR previews on or off for a web service. When on, a pull request against the tracked branch spins up a preview deployment with a branched copy of the database, torn down when the PR closes. Requires ADMIN on the owning team.
  """
  setServicePreviewsEnabled(enabled: Boolean!, serviceId: ID!): Service!

  """
  Set the workspace's default deploy region, used to pre-select the region for new services. Omit `region` to clear it. Requires ADMIN on the team.
  """
  setTeamDefaultRegion(region: String, teamId: ID!): Team!

  """
  Turn PR deployment previews on or off as the workspace-wide default for new services. Requires ADMIN on the team.
  """
  setTeamDeploymentPreviews(enabled: Boolean!, teamId: ID!): Team!

  """
  Require two-factor authentication for members who change production environments. While on, a member without it is refused any write to an environment named prod, production, prd or live. Turning it on needs two-factor on your own account. Requires ADMIN on the team.
  """
  setTeamTwoFactorPolicy(required: Boolean!, teamId: ID!): Team!

  """
  Public. Exchange a GitHub OAuth code for a session, creating the account on first use and setting the auth cookie. When the email already has an account that cannot be linked automatically (either side unverified), returns `existingAccount` instead and creates nothing. Throttled to 10 per minute.
  """
  signInWithGithub(code: String!): GithubSignInResult!

  """
  Public self-serve signup: creates the user and a personal team, sets the HttpOnly auth cookie and returns a JWT. Throttled to 5 per hour per client.
  """
  signup(RegisterInput: RegisterInput!): AuthPayload!

  """
  Retrieve the EPP/auth code needed to transfer a domain to another registrar. Nothing here changes: the domain stays registered and its DNS keeps answering until the receiving registrar completes the transfer. Refused with the date while the registry lock is on. Requires ADMIN on the owning team.
  """
  startDomainTransferOut(domainId: ID!): DomainTransferAuth!

  """
  Send an SMS verification code to a phone number and attach the challenge to the signed-in account. Each send costs money, so it is throttled to 5 per 10 minutes here and per-number in the service.
  """
  startPhoneVerification(phone: String!): PhoneVerificationStarted!

  """
  Start a multipart upload, so a large file can be sent as parts in parallel. Sign the parts with storageUploadPartUrls, then call completeStorageMultipartUpload (or abortStorageMultipartUpload). Requires MEMBER on the team.
  """
  startStorageMultipartUpload(StartMultipartUploadInput: StartMultipartUploadInput!, region: String, teamId: ID!): StorageMultipartUpload!

  """
  Start setting up an authenticator app: returns a new secret and its otpauth:// URI. Nothing changes at sign-in until confirmTwoFactorEnrollment accepts a code from it. Session only.
  """
  startTwoFactorEnrollment: TwoFactorEnrollment!

  """
  Open a top-up for the given amount in minor units and return the row carrying its checkoutUrl. Nothing is credited here - the balance moves only when the signed provider webhook confirms settlement. Requires ADMIN on the team.
  """
  startWalletTopUp(amountMinor: Int!, teamId: ID!): WalletTopUp!

  """
  Short-lived presigned PUT URLs for up to 100 parts of a multipart upload. Each part PUT returns an ETag header to pass to completeStorageMultipartUpload. Requires MEMBER on the team.
  """
  storageUploadPartUrls(PresignUploadPartsInput: PresignUploadPartsInput!, region: String, teamId: ID!): [PresignedUploadPart!]!

  """
  A short-lived presigned PUT URL for uploading one object straight to the store, bypassing the control plane. Requires MEMBER on the team.
  """
  storageUploadUrl(PresignUploadInput: PresignUploadInput!, region: String, teamId: ID!): PresignedUrl!

  """
  Short-lived presigned PUT URLs for up to 100 objects in one bucket, so a folder upload costs one call instead of one per file. Requires MEMBER on the team.
  """
  storageUploadUrls(PresignUploadsInput: PresignUploadsInput!, region: String, teamId: ID!): [PresignedUpload!]!

  """
  Admin-only. Store or rotate one fleet credential in the encrypted secret store. nodeName is required for node-scoped kinds and ignored for fleet-scoped ones. Rotating overwrites the previous value irrecoverably; returns true, never the value.
  """
  storeNodeSecret(kind: NodeSecretKind!, nodeName: String, note: String, value: String!): Boolean!

  """
  Stop a service's containers while keeping everything else — variables, custom domains, subdomain, build settings, deploy history and volumes. Compute stops being billed for the suspended period; stored data is billed as normal. Requires MEMBER on the owning team.
  """
  suspendService(serviceId: ID!): Service!

  """
  Admin-only and disruptive. Stops the customer's running service on an abuse finding. Attributed to the calling admin.
  """
  suspendServiceForAbuse(serviceId: String!): AbuseFindingRow!

  """
  Destructive. Tear a PR preview down early - deletes its environment and branched database now instead of waiting for the pull request to close. Requires ADMIN on the owning team; the teardown itself runs in the background.
  """
  teardownPreview(id: ID!): PrPreview!

  """
  Queue a new build-and-deploy for a web service and return the created deployment. Rejects datastore services. Requires MEMBER on the owning team.
  """
  triggerDeploy(serviceId: ID!): Deployment!

  """
  Stop following a thread. Idempotent by design, unlike the communityFollow toggle, because it is reached from an unsubscribe link that mail clients may prefetch.
  """
  unfollowCommunityDiscussion(postId: ID!): Boolean!

  """
  Change a database's backup policy - retention window, the UTC time scheduled backups fire, point-in-time recovery and the backup region. Omitted arguments are left unchanged; pass backupRegion: null to reset it. Requires MEMBER on the owning team.
  """
  updateBackupPolicy(backupRegion: String, pitrEnabled: Boolean, retentionDays: Int, scheduleHour: Int, scheduleMinute: Int, serviceId: ID!): BackupSchedule!

  """
  Change the workspace's spending controls - budget, alert thresholds and auto-top-up. Requires ADMIN on the team.
  """
  updateBillingSettings(BillingSettingsInput: BillingSettingsInput!, teamId: ID!): BillingSettingsView!

  """
  Change a cron job's schedule and/or command and re-apply it to the scheduler. Returns the updated service. Requires MEMBER on the owning team.
  """
  updateCronJob(UpdateCronJobInput: UpdateCronJobInput!): Service!

  """
  Replace a customer-owned record's contents and republish the zone. Records we manage are not editable. Requires MEMBER on the owning team.
  """
  updateDnsRecord(DnsRecordInput: DnsRecordInput!, recordId: ID!): DnsRecord!

  """
  Set the signed-in user's full name. One field; it is never split into first and last name by the client. Returns the updated user.
  """
  updateMe(UpdateMeInput: UpdateMeInput!): User!

  """
  Enable or disable one or more optional notification categories for the signed-in user; writes to a mandatory category do nothing. Returns the full resolved set.
  """
  updateNotificationPreferences(UpdateNotificationPreferenceInput: [UpdateNotificationPreferenceInput!]!): [NotificationPreferenceItem!]!

  """
  Change a project's name, display name and/or description; omitted arguments are left alone. Requires MEMBER on the owning team.
  """
  updateProject(description: String, displayName: String, id: ID!, name: String): Project!

  """
  Update one row identified by its primary key and return the row as persisted, so the grid shows canonical values. Rejects tables without a primary key. Requires MEMBER on the owning team.
  """
  updateRow(changes: [ColumnValueInput!]!, pk: [ColumnValueInput!]!, schema: String, serviceId: ID!, table: String!): RowMutationResult!

  """
  Rename a service. The name is a label only — the subdomain, any custom domains and any injected connection URL are unchanged, and nothing is redeployed. Requires MEMBER on the owning team.
  """
  updateService(name: String!, serviceId: ID!): Service!

  """
  Edit a web service's build configuration - runtime version, build and start commands, port. Applies on the next deploy. Requires MEMBER on the owning team.
  """
  updateServiceBuild(UpdateServiceBuildInput: UpdateServiceBuildInput!, serviceId: ID!): Service!

  """
  Move a web service to another deploy region. Forces a full rebuild on the target node and repoints the service's DNS; the old node's containers are reclaimed afterwards, so expect a cutover. Requires ADMIN on the owning team.
  """
  updateServiceRegion(region: String!, serviceId: ID!): Service!

  """
  Set a service's resource caps: pass a tier, or explicit memoryMb and cpuMillicores. For a datastore, storageLimitMb overrides the disk quota, otherwise a tier change moves it to that tier's default. Takes effect on the next deploy. Requires ADMIN on the owning team.
  """
  updateServiceResources(cpuMillicores: Int, memoryMb: Int, serviceId: ID!, storageLimitMb: Int, tier: ServiceTier): Service!

  """
  Repoint a web or cron service at a different repository, branch, git URL or image. Partial: send only what changes, and the owning GitHub installation is re-resolved automatically. Build and start commands are edited separately. Applies on the next deploy unless input.redeploy is true. Requires ADMIN on the owning team.
  """
  updateServiceSource(UpdateServiceSourceInput: UpdateServiceSourceInput!, serviceId: ID!): Service!

  """
  Edit a workspace role. Requires ADMIN. `permissions` and `projectIds` replace wholesale rather than merging — they are sets. The Owner role cannot be edited.
  """
  updateTeamRole(UpdateTeamRoleInput: UpdateTeamRoleInput!, teamId: ID!): TeamRole!

  """
  Re-check a custom domain's DNS now and refresh its verification status. Requires MEMBER on the owning team.
  """
  verifyCustomDomain(id: ID!): CustomDomain!

  """
  Re-check a sending domain's DNS live and update its verification state; `propagating` marks records that are correct but not yet visible everywhere. Throttled to 60 per 10 minutes because the dashboard polls it.
  """
  verifyMailDomain(id: ID!, teamId: ID!): MailDomainDetail!

  """
  Public. Finish a sign-in that returned `twoFactor`: trade its pendingToken and a 6-digit authenticator code (or a one-time recovery code) for the session, and set the auth cookie. Each code works once; five wrong codes lock the account for 15 minutes. Throttled to 10 per minute.
  """
  verifyTwoFactorSignIn(VerifyTwoFactorSignInInput: VerifyTwoFactorSignInInput!): AuthPayload!
}

type MyService {
  id: ID!
  name: String!
  projectName: String!
  type: ServiceType!
}

"""A page of the caller's services with pagination metadata"""
type MyServiceOffsetPaginated {
  """The MyService rows on this page"""
  items: [MyService!]!

  """Pagination metadata"""
  pageInfo: OffsetPageInfo!
}

type MyTeamAccess {
  allProjects: Boolean!
  permissions: [TeamPermission!]!
  projectIds: [ID!]!
  readOnly: Boolean!
  role: TeamRole
  teamId: ID!
}

enum NameserverMode {
  CUSTOM
  NC
}

type Node {
  appDomain: String!
  cordonReason: String
