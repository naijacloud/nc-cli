  """
  Admin-only. One node's detail drawer: its row, its alerts and its workloads grouped by kind.
  """
  getAdminNode(nodeId: ID!): AdminNodeDetail!

  """
  Admin-only. Every counter and chart the platform-overview screen renders.
  """
  getAdminOverview: AdminOverview!

  """
  Admin-only. The paginated projects table across every team. Limit defaults to 50 and is clamped to 200. Optional search matches the project name, display name or id.
  """
  getAdminProjects(limit: Int, offset: Int, search: String): AdminProjectsPage!

  """
  Admin-only. A page of per-project resource-usage rows for the console's usage cards, newest project first. Sorting and search are ignored: the rollup is computed per page rather than in SQL.
