  A page of the workspace's memberships with each member's role, oldest first. Optional search matches the member's email and display name. Requires MEMBER on the team.
  """
  getTeamMembers(OffsetPaginationArgs: OffsetPaginationArgs, teamId: ID!): TeamMembershipOffsetPaginated!

  """
  A workspace's roles, with how many people hold each and the projects it reaches. The six default roles are created on the first call, so this never returns an empty list for a real workspace.
  """
  getTeamRoles(teamId: ID!): [TeamRoleRow!]!

  """
  Whether two-factor authentication is on for the signed-in user's own account, and how many recovery codes are left.
  """
  getTwoFactorStatus: TwoFactorStatus!

  """
  The workspace's wallet balance in minor units (kobo), its low-balance threshold and whether it has fallen to that threshold. Requires MEMBER on the team.
  """
  getWalletBalance(teamId: ID!): WalletBalance!

  """
  A page of the raw wallet ledger, newest first. Optional search matches the entry description. Requires MEMBER on the team.
  """
  getWalletEntries(OffsetPaginationArgs: OffsetPaginationArgs, teamId: ID!): WalletEntryOffsetPaginated!

  """
  A page of the workspace's top-ups, settled and still pending, newest first. Optional search matches the top-up reference. Requires MEMBER on the team.
  """
  getWalletTopUps(OffsetPaginationArgs: OffsetPaginationArgs, teamId: ID!): WalletTopUpOffsetPaginated!

  """
  A page of the wallet ledger shaped for the billing screen: filtered by age and entry kind, newest first, each row carrying the balance it left behind. Optional search matches the description. Requires MEMBER on the team.
  """
  getWalletTransactions(OffsetPaginationArgs: OffsetPaginationArgs, days: Int, kinds: [WalletEntryKind!], teamId: ID!): WalletTransactionOffsetPaginated!

  """
  Traefik-derived headline HTTP metrics for one web service - requests per minute, p95 latency and error rate. Requires membership of the owning team.
  """
  getWebHeadlineMetrics(serviceId: ID!): WebHeadline!

  """
  Request-count time series for one web service over the given range (default: last 24h), bucketed for the requests chart. Requires membership of the owning team.
  """
  getWebRequestSeries(range: MetricRange, serviceId: ID!): WebRequestSeries!

  """
  Reverse-chronological workspace event feed for a team, optionally scoped to a single project. Pass the previous page's nextCursor to load older events. Requires membership of the team.
  """
  getWorkspaceActivity(cursor: String, limit: Int, projectId: ID, teamId: ID!): WorkspaceActivityPage!

  """
  A page of the workspace's monthly statements, newest first. Search is ignored - statements are read in date order. Requires MEMBER on the team.
  """
  getWorkspaceInvoices(OffsetPaginationArgs: OffsetPaginationArgs, teamId: ID!): InvoiceViewOffsetPaginated!

  """
  Raw per-dimension usage meters for the workspace, before they are turned into money. Requires MEMBER on the team.
  """
  getWorkspaceUsageMeters(teamId: ID!): WorkspaceUsageMeters!
}

