}

"""Availability and price for one candidate domain"""
type DomainSearchRow {
  """Whether this domain can be bought here, right now"""
  available: Boolean!
  domain: String!

  """
  Premium names are priced individually by the registry and cost far more than the standard rate
  """
  premium: Boolean!

  """
  What the customer pays, in kobo, for `years`. Firm, not an estimate — the checkout is created for exactly this amount, so the row, the payment page and the receipt agree. Null when it cannot be sold or cannot be priced right now.
  """
  priceKobo: Float

  """
  The same answer as a code. Branch on this, not on the sentence — the sentence is copy and will be reworded, and "somebody else has it" and "we cannot sell it yet" are opposite answers that look alike.
  """
  unavailableCode: DomainUnavailableReason

  """Why it cannot be bought, in words meant for the customer"""
  unavailableReason: String

  """Years the price covers — some registries only allow one"""
  years: Int!
}

